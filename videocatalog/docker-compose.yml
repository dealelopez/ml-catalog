services:
  videocatalog:
    build: .
    container_name: videocatalog
    stdin_open: true
    tty: true
    working_dir: /app
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      # Código fuente — editable en vivo desde Code Server
      - .:/app
      # Datos persistentes (BD, modelos ML)
      - ${DATA_PATH-./data}:/app/data
      # Vídeos — solo lectura, nunca se modifican
      - ${VIDEOS_PATH:-/videos}:/videos:ro
