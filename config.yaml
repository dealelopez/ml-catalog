# =============================================================================
# config.yaml — Configuración de clasificación (Taxonomía v3.1: 14 categorías + Otros)
# =============================================================================
# v3.1 (2026-11-08): Fotografia_Video fusionada en Diseno_Grafico_UI_UX.
# Basado en docs/261107--propuesta-reorg-taxonomia.md
# Mapeo desde taxonomía v2 (Actual → Nueva):
#   Python, Docker, Linux, IA_ML    → Programacion, DevOps_Cloud, Infra_Sistemas, Datos_Analytics
#   Web                             → Web_Frontend
#   Bases_datos                     → Datos_Analytics
#   Redes, Seguridad, Sistemas      → Infra_Sistemas
#   Diseno_UX, Fotografia           → Diseno_Grafico_UI_UX
#   Arte_dibujo + Pintura + Creatividad → Arte (fusiona ilustración + pintura)
#   Modelado_3D                     → Modelado_3D
#   Productividad                   → Productividad_Herramientas
#   Electronica                     → Electronica_Hardware
#   Escritura                       → Escritura_Narrativa
#   Gestion                         → Negocio_Gestion
#   Ciencia                         → Ciencia
#   Costura                         → Costura_Textil
# IA/GenAI (tensorflow, openai, langchain…) en Datos_Analytics junto al ML
# clásico, coherente con el mapeo de reentreno de scripts/train_classifier.py.
#
# INVARIANTE (2026-11-08): una keyword solo puede pertenecer a una categoría
# (owner único). Lo valida src/config.py::_validate al cargar. Mapeo de owners:
#   - react/vue/svelte/nextjs/nuxt                    → Web_Frontend
#   - pandas/numpy/sklearn/tensorflow/openai/jupyter  → Datos_Analytics
#   - photo/photoshop/premiere/davinci/video editing  → Diseno_Grafico_UI_UX
#   - sketch/composition/character/paper              → Arte
#   - tmux/terminal/cli                               → Infra_Sistemas
#   - poetry (gestor de paquetes de Python)           → Programacion
#   - redshift (render engine)                        → Modelado_3D
# =============================================================================

scan:
  folders:
    - /videos
  extensions: [mp4, mkv, avi, mov, webm, m4v, ts, wmv]
  ignore_folders: [.trash, temp, .tmp, "@eaDir"]

classification:
  confidence_threshold: 0.03

